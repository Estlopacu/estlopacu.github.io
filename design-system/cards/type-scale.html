<!-- @dsCard group="Type" viewport="700x300" name="Type scale" subtitle="Major-third (1.250) ramp" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  html,body{margin:0}
  body{background:var(--surface-card);font-family:var(--font-display);color:var(--text-strong);padding:22px 32px}
  .line{display:flex;align-items:baseline;gap:16px;border-bottom:1px solid var(--border-subtle);padding:7px 0}
  .line:last-child{border-bottom:0}
  .spec{font-family:var(--font-mono);font-size:var(--text-2xs);color:var(--text-muted);width:120px;flex:none;letter-spacing:.04em}
  .sample{font-weight:600;letter-spacing:var(--tracking-tight);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style>
</head>
<body>
  <div class="line"><span class="spec">5xl · 80px</span><span class="sample" style="font-size:var(--text-4xl)">Esteban</span></div>
  <div class="line"><span class="spec">3xl · 48px</span><span class="sample" style="font-size:var(--text-3xl)">Software engineer</span></div>
  <div class="line"><span class="spec">2xl · 36px</span><span class="sample" style="font-size:var(--text-2xl)">Selected work</span></div>
  <div class="line"><span class="spec">xl · 28px</span><span class="sample" style="font-size:var(--text-xl)">Experience timeline</span></div>
  <div class="line"><span class="spec">lg · 22px</span><span class="sample" style="font-size:var(--text-lg)">Section heading</span></div>
  <div class="line"><span class="spec">base · 16px</span><span class="sample" style="font-size:var(--text-base);font-weight:400;font-family:var(--font-body)">Body paragraph text</span></div>
</body>
</html>
