<!-- @dsCard group="Colors" viewport="700x180" name="Slate / ink neutrals" subtitle="Anchored on heritage #4A525A" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  html,body{margin:0}
  body{background:var(--surface-card);font-family:var(--font-mono);padding:24px 28px}
  .ramp{display:flex;border-radius:var(--radius-md);overflow:hidden;box-shadow:var(--shadow-sm)}
  .sw{flex:1;height:92px;display:flex;flex-direction:column;justify-content:flex-end;padding:8px}
  .sw b{font-size:11px;font-weight:500}
  .sw small{font-size:9px;opacity:.8}
  .lt{color:var(--slate-900)} .dk{color:#fff}
  .cap{margin-top:10px;font-size:11px;color:var(--text-muted);letter-spacing:.04em}
</style>
</head>
<body>
  <div class="ramp">
    <div class="sw lt" style="background:var(--slate-50)"><b>50</b></div>
    <div class="sw lt" style="background:var(--slate-100)"><b>100</b></div>
    <div class="sw lt" style="background:var(--slate-200)"><b>200</b></div>
    <div class="sw lt" style="background:var(--slate-300)"><b>300</b></div>
    <div class="sw lt" style="background:var(--slate-400)"><b>400</b></div>
    <div class="sw dk" style="background:var(--slate-500)"><b>500</b></div>
    <div class="sw dk" style="background:var(--slate-600)"><b>600</b><small>#4A525A</small></div>
    <div class="sw dk" style="background:var(--slate-700)"><b>700</b></div>
    <div class="sw dk" style="background:var(--slate-800)"><b>800</b></div>
    <div class="sw dk" style="background:var(--slate-900)"><b>900</b></div>
    <div class="sw dk" style="background:var(--slate-950)"><b>950</b></div>
  </div>
  <div class="cap">Text, borders, and "terminal" dark surfaces all draw from this ramp.</div>
</body>
</html>
