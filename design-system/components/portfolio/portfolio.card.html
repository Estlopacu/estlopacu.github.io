<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  html,body{margin:0}
  body{background:var(--surface-page);font-family:var(--font-body);padding:26px 30px}
  .block{margin-bottom:24px}
  .row{display:flex;gap:12px;align-items:center}
</style>
</head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/lucide@0.453.0/dist/umd/lucide.min.js"></script>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="../../_ds_bundle.js"></script>
  <script type="text/babel">
    const { SectionHeading, SkillBar, TerminalPrompt, SocialLink } = window.EstlopacuPortfolioDesignSystem_604ed3;
    function Demo() {
      React.useEffect(() => { if (window.lucide) window.lucide.createIcons(); });
      return (
        <>
          <div className="block">
            <SectionHeading eyebrow="selected work" title="Things I've built"
              subtitle="A recurring section header: monospace eyebrow over a display title." />
          </div>
          <div className="block">
            <SkillBar name="React" percent={95} />
            <SkillBar name="JavaScript & Node" percent={90} tone="signal" />
            <SkillBar name="PHP" percent={70} />
          </div>
          <div className="block">
            <TerminalPrompt command="whoami" output="Esteban López — software engineer" />
          </div>
          <div className="row">
            <SocialLink icon="github" label="GitHub" href="#" />
            <SocialLink icon="linkedin" label="LinkedIn" href="#" />
            <SocialLink icon="mail" label="Email" href="#" />
          </div>
        </>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
  </script>
</body>
</html>
