"$schema" = "https://conductor.build/schemas/settings.repo.schema.json"

[scripts]
# Keep the root checkout current, then install deps with npm. Git refresh is
# best-effort so setup never fails on it.
setup = """
git -C "$CONDUCTOR_ROOT_PATH" fetch --prune origin && git -C "$CONDUCTOR_ROOT_PATH" pull --ff-only || true
npm install
"""

# Astro dev server, bound to the per-workspace port so previews don't collide.
run = "npm run dev -- --port $CONDUCTOR_PORT --host"

# Each workspace serves on its own CONDUCTOR_PORT with no shared resource.
run_mode = "concurrent"
