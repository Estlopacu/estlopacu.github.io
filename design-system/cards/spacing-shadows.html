<!-- @dsCard group="Spacing" viewport="700x200" name="Shadows" subtitle="Cool, blue-tinted elevation + glow" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  html,body{margin:0}
  body{background:var(--surface-page);font-family:var(--font-mono);padding:30px 28px;display:flex;gap:24px;align-items:center;flex-wrap:wrap}
  .item{display:flex;flex-direction:column;align-items:center;gap:12px}
  .box{width:84px;height:60px;background:var(--surface-card);border-radius:var(--radius-md)}
  .lbl{font-size:10px;color:var(--text-muted)}
</style>
</head>
<body>
  <div class="item"><div class="box" style="box-shadow:var(--shadow-xs)"></div><span class="lbl">xs</span></div>
  <div class="item"><div class="box" style="box-shadow:var(--shadow-sm)"></div><span class="lbl">sm</span></div>
  <div class="item"><div class="box" style="box-shadow:var(--shadow-md)"></div><span class="lbl">md</span></div>
  <div class="item"><div class="box" style="box-shadow:var(--shadow-lg)"></div><span class="lbl">lg</span></div>
  <div class="item"><div class="box" style="box-shadow:var(--shadow-xl)"></div><span class="lbl">xl</span></div>
  <div class="item"><div class="box" style="box-shadow:var(--shadow-glow)"></div><span class="lbl">glow</span></div>
  <div class="item"><div class="box" style="box-shadow:var(--shadow-signal)"></div><span class="lbl">signal</span></div>
</body>
</html>
