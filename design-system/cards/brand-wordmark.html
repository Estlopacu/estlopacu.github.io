<!-- @dsCard group="Brand" viewport="700x230" name="Wordmark & monogram" subtitle="Terminal-prompt identity" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  html,body{margin:0}
  body{background:var(--surface-card);font-family:var(--font-body);padding:26px 30px;display:flex;align-items:center;gap:34px}
  .mono{width:86px;height:86px;flex:none;border-radius:var(--radius-lg);background:var(--blue-600);color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:700;font-size:40px;box-shadow:var(--shadow-md);position:relative;overflow:hidden}
  .mono::after{content:"_";position:absolute;bottom:14px;right:16px;color:var(--signal-400);font-family:var(--font-terminal);font-size:32px;animation:blink 1.1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  .stack{display:flex;flex-direction:column;gap:6px}
  .wm{font-family:var(--font-display);font-weight:700;font-size:var(--text-2xl);letter-spacing:var(--tracking-tight);color:var(--text-strong)}
  .wm .dot{color:var(--accent)}
  .alt{font-family:var(--font-terminal);font-size:26px;color:var(--brand);line-height:1}
  .sub{font-family:var(--font-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-muted)}
</style>
</head>
<body>
  <div class="mono">EL</div>
  <div class="stack">
    <div class="wm">Esteban López<span class="dot">.</span></div>
    <div class="alt">~/estlopacu</div>
    <div class="sub">Software Engineer · CR → Berlin</div>
  </div>
</body>
</html>
