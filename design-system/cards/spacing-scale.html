<!-- @dsCard group="Spacing" viewport="700x230" name="Spacing scale" subtitle="8px base · 48px heritage rhythm" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  html,body{margin:0}
  body{background:var(--surface-card);font-family:var(--font-mono);padding:22px 28px;display:flex;flex-direction:column;gap:9px}
  .row{display:flex;align-items:center;gap:14px}
  .spec{width:110px;font-size:11px;color:var(--text-muted);flex:none}
  .bar{height:14px;background:var(--blue-400);border-radius:3px}
  .hl{color:var(--brand);font-weight:600}
</style>
</head>
<body>
  <div class="row"><span class="spec">--space-2 · 8</span><div class="bar" style="width:8px"></div></div>
  <div class="row"><span class="spec">--space-4 · 16</span><div class="bar" style="width:16px"></div></div>
  <div class="row"><span class="spec">--space-5 · 24</span><div class="bar" style="width:24px"></div></div>
  <div class="row"><span class="spec">--space-6 · 32</span><div class="bar" style="width:32px"></div></div>
  <div class="row"><span class="spec hl">--space-8 · 48</span><div class="bar" style="width:48px;background:var(--brand)"></div></div>
  <div class="row"><span class="spec">--space-10 · 64</span><div class="bar" style="width:64px"></div></div>
  <div class="row"><span class="spec">--space-12 · 96</span><div class="bar" style="width:96px"></div></div>
  <div class="row"><span class="spec">--space-16 · 128</span><div class="bar" style="width:128px"></div></div>
</body>
</html>
