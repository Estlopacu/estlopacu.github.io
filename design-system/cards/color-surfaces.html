<!-- @dsCard group="Colors" viewport="700x200" name="Surfaces — light & terminal" subtitle="Default theme vs data-theme=terminal" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  html,body{margin:0}
  body{background:var(--slate-100);font-family:var(--font-body);padding:20px;display:flex;gap:16px}
  .pane{flex:1;border-radius:var(--radius-lg);padding:18px;display:flex;flex-direction:column;gap:10px}
  .light{background:var(--surface-page);border:1px solid var(--border-subtle)}
  .card{background:var(--surface-card);border:1px solid var(--border-subtle);border-radius:var(--radius-md);padding:12px;box-shadow:var(--shadow-sm)}
  .h{font-family:var(--font-display);font-weight:600;color:var(--text-strong);font-size:var(--text-md)}
  .m{font-size:var(--text-sm);color:var(--text-muted)}
  .tag{font-family:var(--font-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-muted)}
</style>
</head>
<body>
  <div class="pane light">
    <span class="tag">default</span>
    <div class="card"><div class="h">Surface card</div><div class="m">Clean white over slate-50 page.</div></div>
  </div>
  <div class="pane" data-theme="terminal" style="background:var(--surface-page);border:1px solid var(--border-subtle)">
    <span class="tag">data-theme="terminal"</span>
    <div class="card"><div class="h">Surface card</div><div class="m">Ink-blue page, slate-900 cards.</div></div>
  </div>
</body>
</html>
