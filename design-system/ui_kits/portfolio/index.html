<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Esteban López Acuña — Software Engineer</title>
<link rel="icon" href="../../assets/favicon.ico">
<link rel="stylesheet" href="../../styles.css">
<link rel="stylesheet" href="portfolio.css">
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/lucide@0.453.0/dist/umd/lucide.min.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel" src="Nav.jsx"></script>
<script type="text/babel" src="Hero.jsx"></script>
<script type="text/babel" src="About.jsx"></script>
<script type="text/babel" src="Experience.jsx"></script>
<script type="text/babel" src="Projects.jsx"></script>
<script type="text/babel" src="Contact.jsx"></script>
<script type="text/babel">
  const STORE_KEY = 'estlopacu-theme';
  function App() {
    const [theme, setTheme] = React.useState(() => localStorage.getItem(STORE_KEY) || 'light');
    React.useEffect(() => {
      document.documentElement.setAttribute('data-theme', theme === 'terminal' ? 'terminal' : '');
      localStorage.setItem(STORE_KEY, theme);
    }, [theme]);
    React.useEffect(() => {
      const io = new IntersectionObserver((entries) => {
        entries.forEach((e) => { if (e.isIntersecting) e.target.classList.add('is-in'); });
      }, { threshold: 0.12 });
      document.querySelectorAll('.pf-reveal').forEach((el) => io.observe(el));
      if (window.lucide) window.lucide.createIcons();
      return () => io.disconnect();
    });
    return (
      <>
        <Nav theme={theme} onToggleTheme={() => setTheme((t) => (t === 'terminal' ? 'light' : 'terminal'))} />
        <main>
          <Hero />
          <About />
          <Experience />
          <Projects />
          <Contact />
        </main>
      </>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
