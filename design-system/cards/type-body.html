<!-- @dsCard group="Type" viewport="700x220" name="Body — IBM Plex Sans" subtitle="Paragraphs & UI text" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  html,body{margin:0}
  body{background:var(--surface-card);font-family:var(--font-body);color:var(--text-body);padding:28px 32px}
  p{margin:0 0 10px;font-size:var(--text-md);line-height:var(--leading-relaxed);max-width:60ch}
  .lead{color:var(--text-strong);font-weight:500}
  em{color:var(--text-muted)}
  .tag{font-family:var(--font-mono);font-size:var(--text-xs);color:var(--text-muted);letter-spacing:var(--tracking-mono);text-transform:uppercase}
</style>
</head>
<body>
  <p class="lead">I'm a full-stack developer from Costa Rica, based in Berlin, who cares about the craft.</p>
  <p>From React front-ends to Node services, I build products that feel <em>fast, clear, and intentional</em>. Body copy stays generous and readable.</p>
  <span class="tag">IBM Plex Sans · 400 / 500 / 600 · leading 1.7</span>
</body>
</html>
