<!-- @dsCard group="Type" viewport="700x230" name="Display — Space Grotesk" subtitle="Headlines & hero type" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  html,body{margin:0}
  body{background:var(--surface-card);font-family:var(--font-body);color:var(--text-strong);padding:28px 32px}
  .row{display:flex;align-items:baseline;gap:16px;margin-bottom:6px}
  .d1{font-family:var(--font-display);font-weight:700;font-size:var(--text-3xl);letter-spacing:var(--tracking-tight);line-height:var(--leading-tight)}
  .d2{font-family:var(--font-display);font-weight:600;font-size:var(--text-xl);letter-spacing:var(--tracking-tight)}
  .tag{font-family:var(--font-mono);font-size:var(--text-xs);color:var(--text-muted);letter-spacing:var(--tracking-mono);text-transform:uppercase}
  .meta{font-family:var(--font-mono);font-size:var(--text-2xs);color:var(--text-muted)}
</style>
</head>
<body>
  <div class="d1">Software engineer<span style="color:var(--accent)">.</span></div>
  <div class="row"><div class="d2">Building thoughtful interfaces</div></div>
  <div class="row" style="margin-top:14px">
    <span class="tag">Space Grotesk</span>
    <span class="meta">700 / 600 · tracking −0.02em · leading 1.05</span>
  </div>
</body>
</html>
