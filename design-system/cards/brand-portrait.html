<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  html,body{margin:0}
  body{background:var(--blue-950);font-family:var(--font-body);padding:26px 30px;display:flex;align-items:center;gap:30px}
  .pf{width:110px;height:110px;flex:none;border-radius:50%;padding:4px;background:linear-gradient(135deg,var(--azure),var(--signal-400));box-shadow:var(--shadow-signal)}
  .pf img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block;border:3px solid var(--blue-950)}
  .name{font-family:var(--font-display);font-weight:700;font-size:var(--text-xl);color:#fff}
  .role{font-family:var(--font-mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--signal-400);margin-top:2px}
  .links{display:flex;gap:10px;margin-top:14px}
  .lk{font-family:var(--font-mono);font-size:12px;color:var(--slate-300);border:1px solid var(--border-inverse);border-radius:var(--radius-pill);padding:6px 14px}
</style>
</head>
<body>
  <div class="pf"><img src="../assets/profile.jpg" alt="Esteban López Acuña"></div>
  <div>
    <div class="name">Luis Esteban López Acuña</div>
    <div class="role">Web Developer · Berlin · @estlopacu</div>
    <div class="links"><span class="lk">github</span><span class="lk">linkedin</span><span class="lk">estlopacu@gmail.com</span></div>
  </div>
</body>
</html>
